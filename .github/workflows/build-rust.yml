name: Build Pure Rust (Android APK & Windows EXE)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-rust-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure preinstalled Android SDK & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-$(ls -d $SDK_ROOT/ndk/* | sort -V | tail -n 1)}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build Pure Rust Android APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias sinavkoc -keyalg RSA -keysize 2048 -validity 10000 -storepass sinavkoc123 -keypass sinavkoc123 -dname "CN=SinavKoc,O=SinavKoc,C=TR"
          cargo apk build --release --lib

      - name: Upload Pure Rust APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Pushup-Coach-Android-APK
          path: target/release/apk/*.apk

  build-rust-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test

      - name: Build Windows native EXE
        run: cargo build --release

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AI-Pushup-Coach-Windows-EXE
          path: target/release/sinav-koc.exe
