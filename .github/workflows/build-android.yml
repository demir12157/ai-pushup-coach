name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download MediaPipe Pose Landmarker model (bundled offline)
        run: |
          mkdir -p app/src/main/assets
          curl -fSL -o app/src/main/assets/pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task

      - name: Generate Release Keystore & Build Signed APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias sinavkoc -keyalg RSA -keysize 2048 -validity 10000 -storepass sinavkoc123 -keypass sinavkoc123 -dname "CN=SinavKoc,O=SinavKoc,C=TR"
          gradle assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SinavKoc-Native-Android-APK
          path: app/build/outputs/apk/release/app-release.apk
